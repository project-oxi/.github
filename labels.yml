# Labels for the project-oxi organization.
#
# Single source of truth for label names, colors, and descriptions.
# 40 canonical labels grouped into: type (11), area (13),
# status (9), priority (4), difficulty (2), release (1).
#
# Apply with the sync script (recommended, idempotent):
#   gh api repos/project-oxi/labels-template  # ensure template repo exists
#   python3 scripts/sync-labels.py
#
# Or use `gh label clone` against oxicode as template (oxicode also
# carries 7 oxi-only labels — provider:* and area: agent/ai/
# extensions/security — which propagate to the target. Run the sync
# script first to filter them out):
# (Requires `gh` CLI authenticated to project-oxi with labels:write
#  on each target repo.)
#
# oxiline is private and not yet published — excluded from sync.
# Re-color / re-organize all labels on a repo with:
#   gh label edit <name> --color <hex> --description "<text>" --repo project-oxi/<repo>

# ──────────────────────────── Type ────────────────────────────
# Why this PR or issue exists. Pick at most ONE per PR.
# Color spectrum: green = new, red = broken/needs-attention, neutral = hygiene.

- name: "type: enhancement"
  color: "0e8a16"
  description: "New user-visible capability or improvement."

- name: "type: bug"
  color: "d73a4a"
  description: "Fix for a broken or incorrect behavior."

- name: "type: regression"
  color: "b60205"
  description: "Used to work, now broken — deserves a hotfix."

- name: "type: security"
  color: "b60205"
  description: "Security vulnerability or hardening change. See SECURITY.md."

- name: "type: breaking"
  color: "b60205"
  description: "Breaking change requiring migration notes or major version bump."

- name: "type: performance"
  color: "5319e7"
  description: "Performance, throughput, memory, or compile-time improvement (benchmarked)."

- name: "type: refactor"
  color: "cfd3d7"
  description: "Code reorganization without behavior change."

- name: "type: docs"
  color: "0075ca"
  description: "Documentation-only change (no behavior change)."

- name: "type: test"
  color: "bfd4f2"
  description: "Add or modify tests only."

- name: "type: chore"
  color: "cccccc"
  description: "Tooling, CI, dependencies, or maintenance with no user-visible change."

- name: "type: revert"
  color: "ffffff"
  description: "Reverts a previous commit."

# ──────────────────────────── Area ────────────────────────────
# What code area is affected. Project-agnostic — applies to every repo.
# Project-specific scopes (e.g. `area: capture` for oximemo) are added
# per-repo, not here. Pick at most ONE per PR.

- name: "area: core"
  color: "1d76db"
  description: "Core runtime / engine crate."

- name: "area: cli"
  color: "1d76db"
  description: "Command-line interface or subcommand."

- name: "area: tui"
  color: "1d76db"
  description: "Terminal user interface (Ratatui, vtui, Textual)."

- name: "area: web"
  color: "1d76db"
  description: "Web frontend (React, Tailwind, Astro, Vite)."

- name: "area: desktop"
  color: "1d76db"
  description: "Desktop / Tauri shell."

- name: "area: api"
  color: "1d76db"
  description: "Public API surface (HTTP, RPC, gRPC, MCP, A2A)."

- name: "area: lsp"
  color: "1d76db"
  description: "Language Server Protocol integration."

- name: "area: sdk"
  color: "1d76db"
  description: "Software Development Kit."

- name: "area: browser"
  color: "1d76db"
  description: "Browser engine (HTML/JS parsing, layout, CDP)."

- name: "area: db"
  color: "1d76db"
  description: "Database, storage, indexing, FTS, schema migration."

- name: "area: ci"
  color: "fbca04"
  description: "Continuous integration (GitHub Actions, dependabot, supply chain)."

- name: "area: docs"
  color: "fbca04"
  description: "Documentation (README, doc/, AGENTS.md, CONTRIBUTING, RFCs, design docs)."

- name: "area: design"
  color: "fbca04"
  description: "Design tokens, components, OKLCH system."

# ──────────────────────────── Status ────────────────────────────
# Triage state. Applied by maintainers (and sometimes contributors).

- name: "status: needs-triage"
  color: "ededed"
  description: "Awaiting maintainer review and reproduction."

- name: "status: needs-design"
  color: "d4c5f9"
  description: "Needs design review before implementation."

- name: "status: needs-security-review"
  color: "b60205"
  description: "Affects security-sensitive area (see SECURITY.md)."

- name: "status: needs-info"
  color: "e4e669"
  description: "Reporter must provide more information before triage."

- name: "status: blocked"
  color: "ee0701"
  description: "Cannot progress — waiting on external dependency or decision."

- name: "status: in-progress"
  color: "fef2c0"
  description: "Currently being worked on."

- name: "status: review"
  color: "1d76db"
  description: "PR is open and awaiting code review."

- name: "status: wontfix"
  color: "ffffff"
  description: "Will not be addressed (with explanation)."

- name: "status: duplicate"
  color: "cccccc"
  description: "Duplicates an existing issue or PR."

# ──────────────────────────── Priority ────────────────────────────
# Urgency. Applied by maintainers. Skip when unclear.

- name: "priority: critical"
  color: "b60205"
  description: "Drop everything — production breakage or CVE."

- name: "priority: high"
  color: "d93f0b"
  description: "Important — should land in the next release."

- name: "priority: medium"
  color: "fbca04"
  description: "Normal — addressed in regular cadence."

- name: "priority: low"
  color: "0e8a16"
  description: "Backlog — whenever bandwidth allows."

# ──────────────────────────── Difficulty ────────────────────────────
# Optional good-first-issue / help-wanted markers.

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers — small scope, clear acceptance criteria."

- name: "help wanted"
  color: "008672"
  description: "Extra attention is wanted — maintainer bandwidth is limited."

# ──────────────────────────── Release ────────────────────────────
# Used to flag PRs that must ship together.

- name: "release"
  color: "7057ff"
  description: "Marks a release-bound change."